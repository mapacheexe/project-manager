<div class="stage-column">
  <div class="stage-column__header" [style.border-left-color]="accentColor()">
    @if (editingName()) {
      <input
        class="stage-column__rename-input"
        type="text"
        [value]="pendingName()"
        (input)="pendingName.set($any($event.target).value)"
        (keydown.enter)="confirmRename()"
        (keydown.escape)="cancelRename()"
        (blur)="confirmRename()"
      />
    } @else {
      <h3 class="stage-column__title" (click)="startEditing()" title="Haz clic para renombrar">{{ stage().name }}</h3>
    }
    <div class="stage-column__actions">
      <button class="btn btn--ghost btn--sm" type="button" [disabled]="isFirst()" (click)="stageMovedLeft.emit(stage().id)" title="Mover a la izquierda">←</button>
      <button class="btn btn--ghost btn--sm" type="button" [disabled]="isLast()" (click)="stageMovedRight.emit(stage().id)" title="Mover a la derecha">→</button>
      <button class="btn btn--ghost btn--sm" type="button" (click)="stageDeleted.emit(stage().id)" title="Eliminar etapa">✕</button>
    </div>
  </div>

  <div class="stage-column__tasks">
    @for (task of stage().tasks; track task.id) {
      <app-task-card
        [task]="task"
        (statusChanged)="taskStatusChanged.emit($event)"
        (editRequested)="taskEditRequested.emit($event)"
        (deleteRequested)="taskDeleteRequested.emit($event)"
      />
    } @empty {
      <div class="empty-state empty-state--sm">
        <svg class="empty-state__icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="4" rx="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        </svg>
        <p class="empty-state__text">Sin tareas aún</p>
      </div>
    }
  </div>

  <button class="btn btn--ghost btn--sm stage-column__add-task" type="button"
    (click)="taskCreateRequested.emit(stage().id)">
    + Añadir tarea
  </button>
</div>
