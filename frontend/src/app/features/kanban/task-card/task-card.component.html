<div class="task-card" (click)="editRequested.emit(task())">
  <p class="task-card__title">{{ task().title }}</p>
  <div class="task-card__footer" (click)="$event.stopPropagation()">
    <select
      class="task-card__status task-card__status--{{ task().status | lowercase }}"
      [value]="task().status"
      (change)="onStatusChange($any($event.target).value)"
    >
      <option value="PENDING">Pendiente</option>
      <option value="IN_PROGRESS">En progreso</option>
      <option value="DONE">Hecho</option>
    </select>
    <div class="task-card__actions">
      <select
        class="task-card__move-select"
        [value]="task().stageId"
        (change)="onStageChange($any($event.target).value)"
      >
        @for (stage of stages(); track stage.id) {
          <option [value]="stage.id">{{ stage.name }}</option>
        }
      </select>
      <button class="btn btn--ghost btn--sm" type="button" (click)="deleteRequested.emit(task())">✕</button>
    </div>
  </div>
</div>
