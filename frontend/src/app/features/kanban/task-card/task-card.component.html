<div class="task-card" (click)="editRequested.emit(task())">
  <p class="task-card__title">{{ task().title }}</p>
  <div class="task-card__footer" (click)="$event.stopPropagation()">
    <div class="task-card__status task-card__status--{{ task().status | lowercase }}">
      <select
        [value]="task().status"
        (change)="onStatusChange($any($event.target).value)"
      >
        <option value="PENDING"   [selected]="task().status === 'PENDING'">Pendiente</option>
        <option value="IN_PROGRESS" [selected]="task().status === 'IN_PROGRESS'">En progreso</option>
        <option value="DONE"      [selected]="task().status === 'DONE'">Hecho</option>
      </select>
    </div>
    <div class="task-card__actions">
      <button class="btn btn--ghost btn--sm" type="button" (click)="deleteRequested.emit(task())">✕</button>
    </div>
  </div>
</div>
