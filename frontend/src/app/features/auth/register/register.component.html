<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">Crear cuenta</h1>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          class="form-control"
          id="name"
          type="text"
          formControlName="name"
          autocomplete="name"
          placeholder="Tu nombre"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          class="form-control"
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          class="form-control"
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="••••••••"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Repetir contraseña</label>
        <input
          class="form-control"
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="••••••••"
        />
      </div>

      @if (passwordMismatch()) {
        <p class="auth-form__error">Las contraseñas no coinciden.</p>
      }

      @if (registerError()) {
        <p class="auth-form__error">{{ registerError() }}</p>
      }

      <button class="btn btn--full" type="submit" [disabled]="form.invalid">Registrarse</button>
    </form>

    <p class="auth-card__footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
