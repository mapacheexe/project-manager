<div class="project-card" (click)="selected.emit(project())">
  <div class="project-card__accent" [style.background]="accentColor()"></div>
  <h3 class="project-card__name">{{ project().name }}</h3>
  <div class="project-card__meta">
    <span>{{ project().stages.length }} etapas</span>
    <span>{{ project().userIds.length }} miembros</span>
  </div>
  <div class="project-card__actions" (click)="$event.stopPropagation()">
    <button class="btn btn--ghost btn--sm" type="button" (click)="deleteRequested.emit(project())">Eliminar</button>
  </div>
</div>
