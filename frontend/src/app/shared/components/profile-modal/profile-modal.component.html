<div class="modal-overlay" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <div class="profile-modal__header">
      <div class="profile-modal__avatar">{{ avatarInitial() }}</div>
      <h3 class="modal-box__title">Editar perfil</h3>
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input
        class="form-control"
        type="text"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        (keydown.enter)="submit()"
      />
    </div>

    <div class="modal-box__actions">
      <button class="btn btn--ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn" type="button" [disabled]="saveDisabled()" (click)="submit()">Guardar</button>
    </div>

    <div class="profile-modal__danger">
      <p class="profile-modal__danger-label">Zona peligrosa</p>
      <button class="btn btn--danger btn--sm" type="button" (click)="deleteRequested.emit()">
        Eliminar cuenta
      </button>
    </div>

  </div>
</div>
