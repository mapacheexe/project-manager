<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3 class="modal__title">Editar perfil</h3>

    <div class="form-field">
      <label class="form-field__label">Nombre</label>
      <input
        class="form-field__input"
        type="text"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </div>

    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn" type="button" [disabled]="!name().trim()" (click)="submit()">Guardar</button>
    </div>

    <hr class="modal__divider" />

    <button class="btn btn--danger btn--sm" type="button" (click)="deleteRequested.emit()">
      Eliminar cuenta
    </button>
  </div>
</div>
