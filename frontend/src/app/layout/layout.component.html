<nav class="navbar">
  <a class="navbar__brand" routerLink="/projects">Project Manager</a>
  <div class="navbar__user">
    <button class="navbar__avatar" type="button" (click)="openProfile()" [style.background]="avatarColor()">
      {{ avatarInitial() }}
    </button>
    <button class="navbar__logout" (click)="logout()">Salir</button>
  </div>
</nav>
<main class="content">
  <router-outlet />
</main>
<app-toast />

@if (showProfileModal()) {
  <app-profile-modal
    [currentName]="userName()"
    (saved)="onNameSaved($event)"
    (cancelled)="showProfileModal.set(false)"
    (deleteRequested)="onDeleteRequested()"
  />
}

@if (showDeleteConfirm()) {
  <app-confirm-dialog
    message="¿Eliminar tu cuenta? Esta acción no se puede deshacer."
    (confirmed)="deleteAccount()"
    (cancelled)="showDeleteConfirm.set(false)"
  />
}
