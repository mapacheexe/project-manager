services:
  db:
    image: postgres:16-alpine
    container_name: projectmanager-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: projectmanager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d projectmanager_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: projectmanager-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: projectmanager_db
      PGUSER: admin
      PGPASSWORD: 1234
      JWT_SECRET: project-manager-jwt-secret-key-daw-2026-mario-vereda
      FRONTEND_URL: http://localhost:4200
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: projectmanager-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
